apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cloudsql
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      # devsync-maintenance included: the retention CronJob writes to the DB
      # too, and it matches none of the base selectors.
      values: [devsync-backend, devsync-migrate, devsync-maintenance]
  policyTypes:
  - Egress
  egress:
  # Backend/migrate → Cloud SQL private services access (PSA range for the
  # peered servicenetworking connection). Dormant until Dataplane V2 lands
  # (create-time-only; datapath_provider staged in
  # infra/terraform/modules/gke/main.tf for the planned rebuild window —
  # the CD no-destroy guard correctly refuses the replacement until then).
  # Without this rule the deny-all policy would cut the DB the moment
  # enforcement turns on.
  - to:
    - ipBlock:
        cidr: 10.60.0.0/24
    ports:
    - protocol: TCP
      port: 5432
