# managed-db overlay: prod DB shape on Cloud SQL (plan D6, applied 2026-09-13).
# DATABASE_URL is a Secret Manager secretKeyRef (same as base) — the prod
# value is the Cloud SQL connection string (private IP, sslmode=require).
# No credential value lives in git. postgres.yaml resources are removed via
# strategic-merge $patch: delete, and the Cloud SQL instance annotation marks
# the Auth Proxy attachment point (IAM role roles/cloudsql.client lives on the
# GSA, plan §5.2).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devsync-postgres
  namespace: devsync
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: devsync-postgres
  namespace: devsync
$patch: delete
---
# Backend step 1: attach the Cloud SQL instance annotation and scrub the
# literal in-cluster DSN the prod patch wrote (a strategic-merge on the same
# env item would leave BOTH value and valueFrom merged — an illegal entry the
# kubelet rejects). Deletion happens in a doc ordered before the re-add below.
# Backend step 0 (before the DB rewiring): drop the wait-for-db
# initContainer. It polls devsync-postgres:5432 — a Service this overlay
# DELETES — keeping it means every pod restart CrashLoops 120s on dead DNS.
# Its reason (headless-Service boot timing on the in-cluster PG) doesn't apply
# to a managed DB that lives outside the namespace and is always up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    spec:
      $patch: merge
      initContainers:
      - name: wait-for-db
        $patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    metadata:
      annotations:
        cloudsql.cloud.google.com/instances: project-7f2bbd9a-c5f0-48d2-b08:us-central1:devsync-db
    spec:
      $patch: merge
      containers:
      - name: backend
        env:
        - name: DATABASE_URL
          $patch: delete
---
# Backend step 2: DATABASE_URL comes back as the Secret Manager secretKeyRef
# (ESO-synced Cloud SQL DSN).
# Private-IP-direct in v1: no Cloud SQL Auth Proxy sidecar is injected here
# by design — connectivity is the instance's private IP through VPC peering
# with sslmode=require. Add the proxy sidecar only if public-IP or IAM-DB-auth
# is ever needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: DATABASE_URL
---
# Same drop for the migrate Job's own wait-for-db (same dead-DNS failure mode
# on every deploy under the managed-db overlay).
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    spec:
      $patch: merge
      initContainers:
      - name: wait-for-db
        $patch: delete
---
# Migrate Job steps: same two-phase rewiring — delete the literal DSN, then
# re-add the secretKeyRef so the job migrates the managed DB, never the
# in-cluster PG.
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    metadata:
      annotations:
        cloudsql.cloud.google.com/instances: project-7f2bbd9a-c5f0-48d2-b08:us-central1:devsync-db
    spec:
      $patch: merge
      containers:
      - name: migrate
        env:
        - name: DATABASE_URL
          $patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: DATABASE_URL
