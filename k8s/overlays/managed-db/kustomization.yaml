apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod shape WITH Cloud SQL (Phase 2 D6, applied): stacks on prod and drops the
# in-cluster postgres resources so the standing environment runs on Cloud SQL
# private IP. DATABASE_URL is the Secret Manager secretRef via ESO — the prod
# value points at the Cloud SQL connection string (private IP, sslmode=require).
# No credential value lives in git.
resources:
- ../prod
- allow-egress-cloudsql.yaml
patches:
- path: patch-database-url.yaml
