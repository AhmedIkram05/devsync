# The PR workflow points DATABASE_URL at the SHARED external PR database
# (secrets.PR_DATABASE_URL), so the in-cluster StatefulSet + Service that
# k8s/base/postgres.yaml declares are only ever used to satisfy the wait-for-db
# initContainer: every PR burned a postgres pod so that a poll of
# devsync-postgres:5432 could succeed before the app connected somewhere else.
# Both are dropped here, mirroring the managed-db overlay (where the real
# database is Cloud SQL) - including the initContainer, which would otherwise
# poll a Service this overlay deletes and stall the pod/migrate Job for the full
# 120s before exiting non-zero.
#
# Namespace matches the base's pre-transform namespace (same convention as the
# other drop-*.yaml patches; the overlay's `namespace: pr-0` rename is applied
# afterwards).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devsync-postgres
  namespace: devsync
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: devsync-postgres
  namespace: devsync
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    spec:
      $patch: merge
      initContainers:
      - name: wait-for-db
        $patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    spec:
      $patch: merge
      initContainers:
      - name: wait-for-db
        $patch: delete
