# Prod overlay: point the backend at the in-cluster standing-environment
# Postgres instead of the Secret Manager DATABASE_URL. kubelet expands $(POSTGRES_PASSWORD) from
# the entry above it, so no credential value is stored here. The explicit
# ?sslmode=disable matters: config.py appends sslmode=require for any host it
# does not recognise as local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: DATABASE_URL
          $patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: backend
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://devsync:$(POSTGRES_PASSWORD)@devsync-postgres:5432/devsync?sslmode=disable"
---
# Same rewiring for the migrate Job: it must migrate the in-cluster standing-environment
# database, not whatever DATABASE_URL Secret Manager holds.
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: migrate
        env:
        - name: DATABASE_URL
          $patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devsync-migrate
  namespace: devsync
spec:
  template:
    spec:
      containers:
      - name: migrate
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://devsync:$(POSTGRES_PASSWORD)@devsync-postgres:5432/devsync?sslmode=disable"
