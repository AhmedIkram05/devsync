# Prod overlay: declare every host that DNS actually points at the LB
# (devsyncapp.me and www per the registrar; gcp.devsyncapp.me is the legacy /
# CD-verify host). The GCE LB serves 404 for any host not declared here, so
# this list must stay in sync with the A/CNAME records. Declaring hosts
# explicitly (instead of a catch-all) still blocks arbitrary domains pointed
# at the LB from routing to the app.
- op: replace
  path: /spec/rules
  value:
  - host: devsyncapp.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsync-frontend
            port:
              number: 80
  - host: www.devsyncapp.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsync-frontend
            port:
              number: 80
  - host: gcp.devsyncapp.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsync-frontend
            port:
              number: 80
