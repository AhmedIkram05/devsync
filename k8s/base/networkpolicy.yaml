# Default-deny + least-privilege egress for the devsync namespace.
#
# ENFORCEMENT NOTE: enforced by the GKE Network Policy add-on (Projected
# Calico). Dataplane V2 cannot be enabled on an existing Standard cluster
# ("only when you create a new GKE cluster"), so the add-on is the
# enforcement path here. DPv2 stays staged in
# infra/terraform/modules/gke/main.tf for the rebuild window, where it takes
# over enforcement and unlocks enable_fqdn_network_policy — that is what
# eventually replaces the 0.0.0.0/0 backend rule with GitHub's published
# CIDRs/FQDNs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    # GKE node-local DNS proxy (node link-local, not a pod) — first hop
    # for every query; without this, default-deny kills all resolution.
    - ipBlock:
        cidr: 169.254.20.10/32
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # Backend only: it is the sole workload that leaves the cluster over the
  # internet (GitHub API: OAuth token exchange, repo sync, webhooks).
  # Frontend/redis/postgres get no internet egress — default-deny holds.
  # 0.0.0.0/0 stays until DPv2 (create-time-only) unlocks FQDN policies.
  podSelector:
    matchLabels:
      app: devsync-backend
  policyTypes:
  - Egress
  # GitHub API + Artifact Registry pulls. FQDN policy later.
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [devsync-backend, devsync-migrate]
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Frontend to backend only.
  - from:
    - podSelector:
        matchLabels:
          app: devsync-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Backend/migrate to backend (self) and Postgres. Frontend is NOT here:
  # only backend/migrate may reach PG:5432 (see allow-frontend-egress).
  - to:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: devsync-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: devsync-redis
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maintenance-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # The daily maintenance CronJob runs with app=devsync-maintenance, which
  # matches none of the selectors above — under default-deny it would get DNS
  # only and fail its DB connection every night at 03:00. It is not listed in
  # allow-internal because that policy would also hand it ingress from the
  # frontend and egress to the backend, which it never uses.
  podSelector:
    matchLabels:
      app: devsync-maintenance
  policyTypes:
  - Egress
  egress:
  # Retention cleanup is pure state work: no internet egress, no ingress.
  # Redis is deliberately absent — settings/maintenance services never touch
  # it. The managed-db overlay adds the Cloud SQL CIDR for this same pod.
  - to:
    - podSelector:
        matchLabels:
          app: devsync-postgres
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: devsync
  labels:
    app: devsync-redis
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-redis
  policyTypes:
  - Ingress
  ingress:
  # Only the backend reaches Redis (message queue + rate limiter). No
  # frontend or inter-redis traffic — default-deny covers the rest.
  - from:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-frontend
  policyTypes:
  - Egress
  egress:
  # Frontend talks to the backend only — no path to Postgres.
  - to:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-frontend
  policyTypes:
  - Ingress
  ingress:
  # GCE load-balancer health checks + client traffic to the frontend.
  - from:
    - ipBlock:
        cidr: 130.211.0.0/22
    - ipBlock:
        cidr: 35.191.0.0/16
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [devsync-backend, devsync-migrate]
    ports:
    - protocol: TCP
      port: 5432
