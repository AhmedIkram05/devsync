# Default-deny + least-privilege egress for the devsync namespace.
#
# ENFORCEMENT NOTE — THESE POLICIES ARE NOT ENFORCED TODAY.
# The cluster runs stock GKE CNI with datapathProvider unset, so every policy
# below binds at admission and nothing enforces it: pod traffic is unrestricted
# (Active Assist NETWORK_POLICIES_UNRECONCILED). Full diagnosis, including why
# the Network Policy add-on cannot enforce them here, is in
# docs/audit-2026-10-09.md "Infra blockers".
#
# The add-on was enabled in PR #205 and abandoned in #206: GKE installs
# calico-typha and the calico-node DaemonSet but never tigera-operator, so the
# projectcalico.org/ds-ready=true node label is never applied, calico-node stays
# at DESIRED 0, and felix never programs the datapath. Proven by a
# port-differential probe — external :80 stayed reachable while policy allows
# only :443. It cannot be switched off either: GKE answers
# --update-addons=NetworkPolicy=DISABLED with "Node pool devsync-pool requires
# recreation", so it stays parked and inert until the rebuild.
#
# Real enforcement requires Dataplane V2, create-time-only for Standard clusters
# ("You can't modify this setting for an existing cluster") — i.e. the rebuild
# staged in infra/terraform/modules/gke/main.tf, which also goes zonal→regional.
# DPv2 supersedes the add-on entirely (GKE rejects network_policy_config with
# datapathProvider=ADVANCED_DATAPATH) and unlocks enable_fqdn_network_policy,
# which is what eventually replaces the 0.0.0.0/0 backend rule below with
# GitHub's published CIDRs/FQDNs.
#
# Until then these rules are correct only by review: nothing will report a
# missing or wrong one at runtime. allow-maintenance-egress exists for exactly
# that reason — the maintenance CronJob matched no selector, a gap no
# enforcement was around to reveal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    # GKE node-local DNS proxy (node link-local, not a pod) — first hop
    # for every query; without this, default-deny kills all resolution.
    - ipBlock:
        cidr: 169.254.20.10/32
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # Backend only: it is the sole workload that leaves the cluster over the
  # internet (GitHub API: OAuth token exchange, repo sync, webhooks).
  # Frontend/redis/postgres get no internet egress — default-deny holds.
  # 0.0.0.0/0 stays until DPv2 (create-time-only) unlocks FQDN policies.
  podSelector:
    matchLabels:
      app: devsync-backend
  policyTypes:
  - Egress
  # GitHub API + Artifact Registry pulls. FQDN policy later.
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [devsync-backend, devsync-migrate]
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Frontend to backend only.
  - from:
    - podSelector:
        matchLabels:
          app: devsync-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Backend/migrate to backend (self) and Postgres. Frontend is NOT here:
  # only backend/migrate may reach PG:5432 (see allow-frontend-egress).
  - to:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: devsync-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: devsync-redis
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-maintenance-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # The daily maintenance CronJob runs with app=devsync-maintenance, which
  # matches none of the selectors above — under default-deny it would get DNS
  # only and fail its DB connection every night at 03:00. It is not listed in
  # allow-internal because that policy would also hand it ingress from the
  # frontend and egress to the backend, which it never uses.
  podSelector:
    matchLabels:
      app: devsync-maintenance
  policyTypes:
  - Egress
  egress:
  # Retention cleanup is pure state work: no internet egress, no ingress.
  # Redis is deliberately absent — settings/maintenance services never touch
  # it. The managed-db overlay adds the Cloud SQL CIDR for this same pod.
  - to:
    - podSelector:
        matchLabels:
          app: devsync-postgres
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: devsync
  labels:
    app: devsync-redis
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-redis
  policyTypes:
  - Ingress
  ingress:
  # Only the backend reaches Redis (message queue + rate limiter). No
  # frontend or inter-redis traffic — default-deny covers the rest.
  - from:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-frontend
  policyTypes:
  - Egress
  egress:
  # Frontend talks to the backend only — no path to Postgres.
  - to:
    - podSelector:
        matchLabels:
          app: devsync-backend
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-frontend
  policyTypes:
  - Ingress
  ingress:
  # GCE load-balancer health checks + client traffic to the frontend.
  - from:
    - ipBlock:
        cidr: 130.211.0.0/22
    - ipBlock:
        cidr: 35.191.0.0/16
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  podSelector:
    matchLabels:
      app: devsync-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [devsync-backend, devsync-migrate]
    ports:
    - protocol: TCP
      port: 5432
