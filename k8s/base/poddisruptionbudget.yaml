apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # maxUnavailable, not minAvailable:1 — at 2 replicas both allow one eviction,
  # but when replicas drop to 1 (ephemeral PR overlay pins replicas: 1) a
  # minAvailable:1 PDB gives disruptionsAllowed 0 and blocks node scale-down.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: devsync-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # With the Redis message queue (rooms no longer pod-local) one pod can absorb
  # a voluntary eviction. maxUnavailable:1 (not minAvailable:1) so the
  # single-replica PR overlay can still drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: devsync-backend
# devsync-redis and devsync-postgres deliberately have NO PodDisruptionBudget.
# Both run a single replica, where a PDB cannot help: minAvailable:1 yields
# disruptionsAllowed 0 (blocking node drains forever) and maxUnavailable:1
# simply permits the only pod to be evicted. Their availability is handled
# instead by the Recreate strategy (redis) and by the database being external
# in production - the prod and managed-db overlays drop the in-cluster
# StatefulSet in favour of Cloud SQL.
