apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devsync-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # With replicas 2 + the Redis message queue (rooms no longer pod-local),
  # one pod can absorb a voluntary eviction: minAvailable 1, not maxUnavailable 0.
  minAvailable: 1
  selector:
    matchLabels:
      app: devsync-backend
