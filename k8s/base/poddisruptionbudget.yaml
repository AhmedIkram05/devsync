apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # maxUnavailable, not minAvailable:1 — at 2 replicas both allow one eviction,
  # but when replicas drop to 1 (ephemeral PR overlay pins replicas: 1) a
  # minAvailable:1 PDB gives disruptionsAllowed 0 and blocks node scale-down.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: devsync-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # With the Redis message queue (rooms no longer pod-local) one pod can absorb
  # a voluntary eviction. maxUnavailable:1 (not minAvailable:1) so the
  # single-replica PR overlay can still drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: devsync-backend
