apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devsync-app-secrets
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: devsync-gcp-store
  target:
    name: devsync-app-secrets
    creationPolicy: Owner
  # Secret values live in Secret Manager, never in git. Keys only.
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: DATABASE_URL
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: JWT_SECRET_KEY
  - secretKey: GITHUB_CLIENT_ID
    remoteRef:
      key: GITHUB_CLIENT_ID
  - secretKey: GITHUB_CLIENT_SECRET
    remoteRef:
      key: GITHUB_CLIENT_SECRET
  - secretKey: FERNET_KEY
    remoteRef:
      key: FERNET_KEY
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: POSTGRES_PASSWORD
