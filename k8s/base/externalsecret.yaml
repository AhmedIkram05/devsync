apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devsync-app-secrets
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  # 5m: rotations (JWT/SECRET/FERNET/GitHub) reach pods within one refresh
  # cycle instead of up to an hour (infra-blockers 2026-10-12; was 1h).
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: devsync-gcp-store
  target:
    name: devsync-app-secrets
    creationPolicy: Owner
  # Secret values live in Secret Manager, never in git. Keys only.
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: DATABASE_URL
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: JWT_SECRET_KEY
  # Explicit Flask session key. Optional at the pod level: if absent, the app
  # HKDF-derives a distinct key from JWT_SECRET_KEY (see config.resolve_flask_secret).
  - secretKey: SECRET_KEY
    remoteRef:
      key: SECRET_KEY
  - secretKey: GITHUB_CLIENT_ID
    remoteRef:
      key: GITHUB_CLIENT_ID
  - secretKey: GITHUB_CLIENT_SECRET
    remoteRef:
      key: GITHUB_CLIENT_SECRET
  - secretKey: FERNET_KEY
    remoteRef:
      key: FERNET_KEY
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: POSTGRES_PASSWORD
