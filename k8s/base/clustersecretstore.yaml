# GCP_PROJECT_ID is a deploy-time token, not a real value: the deploy
# workflow sed-replaces it with the live project ID before applying.
# Same token is used in serviceaccount.yaml — keep both in sync.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: devsync-gcp-store
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  provider:
    gcpsm:
      projectID: GCP_PROJECT_ID
      auth:
        workloadIdentity:
          # ZONAL cluster (us-central1-a): idbindtoken lookup is location-based,
          # so this must match the cluster's real location (regional us-central1
          # returned status 404). Fleet-registered + fleet WIF feature enabled.
          clusterLocation: us-central1-a
          clusterName: devsync-prod
          serviceAccountRef:
            name: devsync-ksa
            namespace: devsync
