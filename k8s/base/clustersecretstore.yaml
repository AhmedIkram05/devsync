# GCP_PROJECT_ID is a deploy-time token, not a real value: the deploy
# workflow sed-replaces it with the live project ID before applying.
# Same token is used in serviceaccount.yaml — keep both in sync.
#
# Auth mode: no `auth.workloadIdentity` block on purpose. That block drives
# ESO's fleet-WIF identitybindingtoken path, which 404s on this cluster
# ("could not get idbindtoken token, status: 404"). Without an auth block the
# gcpsm provider falls back to Application Default Credentials = pod identity:
# the external-secrets controller's Kubernetes SA (external-secrets, in
# external-secrets-system) must be annotated with the GSA email and granted
# roles/iam.workloadIdentityUser for svc.id.goog[external-secrets-system/external-secrets]
# on that GSA — already wired live via kubectl/gcloud on 2026-09-12.
# Reported by ESO docs as the "authorize the ESO Core Controller Pod directly"
# pattern.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: devsync-gcp-store
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  provider:
    gcpsm:
      projectID: GCP_PROJECT_ID
