apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devsync-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
