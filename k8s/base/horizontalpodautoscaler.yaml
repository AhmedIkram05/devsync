apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devsync-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devsync-backend
  # Steady state stays 2 (matches the CD verify wait: exactly 2 Running
  # backend pods). CPU utilisation is measured against the 250m request.
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
