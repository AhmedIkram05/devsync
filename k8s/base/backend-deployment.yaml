apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-backend
  namespace: devsync
  labels:
    app: devsync-backend
    app.kubernetes.io/part-of: devsync
spec:
  # Singleton by design (D2): Socket.IO rooms live in process memory and
  # gunicorn pins workers=1, so a second replica would split-brain rooms.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: devsync-backend
  template:
    metadata:
      labels:
        app: devsync-backend
        app.kubernetes.io/part-of: devsync
    spec:
      serviceAccountName: devsync-ksa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-db
        # The postgres Service is headless, so its DNS record only exists once
        # a pod reports ready — backend pods used to crash-loop on
        # "could not translate host name devsync-postgres" during rollouts.
        # Same app image (kustomize selector matches initContainers too), no
        # extra registry dep. Retries 60×2s = 120s ceiling.
        image: devsync-backend
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - |
          import socket, sys, time
          for i in range(60):
              try:
                  socket.create_connection(("devsync-postgres", 5432), timeout=2).close()
                  print(f"DB ready after {i} probes", flush=True)
                  sys.exit(0)
              except OSError as exc:
                  print(f"DB not ready ({exc}); retrying", flush=True)
                  time.sleep(2)
          sys.exit("devsync-postgres:5432 unreachable after 120s")
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: backend
        # Bare name = the kustomize image selector (devsync-backend) matches;
        # workflows/Makefile pin the full AR digest at deploy time.
        image: devsync-backend
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: devsync-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: DATABASE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: JWT_SECRET_KEY
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: GITHUB_CLIENT_SECRET
        - name: FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: devsync-app-secrets
              key: FERNET_KEY
        # Boot takes ~37s (image pull + gunicorn/Flask/alembic import), so a
        # startupProbe owns the boot window (failureThreshold x period = 120s
        # ceiling) and liveness/readiness stay tight — tighter initialDelays
        # rebooted healthy pods mid-boot (observed 1am BackendDown).
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 12
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        lifecycle:
          preStop:
            # GCE LB/NEG deregistration lags SIGTERM: sleep so the endpoint is
            # drained before gunicorn stops, instead of killing in-flight
            # requests at the grace boundary (k6 run #28: p99 30.07s).
            exec:
              command: ["sleep", "15"]
        # Right-sized 2026-09-12: gunicorn single-worker actually uses ~90Mi.
        # The 512Mi request used to consume every free slot on the 4-node
        # e2-small pool and deadlocked postgres scheduling during rollouts
        # (requests must fit, limits stay generous for spikes).
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
