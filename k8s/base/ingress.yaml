apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsync-frontend
  namespace: devsync
  annotations:
    # LOAD-BEARING: the `gce` IngressClass object does NOT exist in this
    # cluster (`kubectl get ingressclass` is empty), so spec.ingressClassName
    # alone matches nothing and GLBC ignores the Ingress entirely (proven
    # 2026-09-12: spec-only Ingress got zero controller events, LB deleted
    # and never rebuilt). Keep this annotation until a `gce` IngressClass
    # exists. Do not "clean up" to spec-only.
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: devsync-prod-cert
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  ingressClassName: gce
  # No host rule on purpose: any domain pointed at the LB (devsyncapp.me,
  # www.devsyncapp.me, gcp.devsyncapp.me) routes to this backend. The pr
  # overlay drops this Ingress entirely.
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsync-frontend
            port:
              number: 80
