apiVersion: v1
kind: LimitRange
metadata:
  name: devsync-limits
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 4Gi
