apiVersion: v1
kind: Service
metadata:
  name: devsync-frontend
  namespace: devsync
  labels:
    app.kubernetes.io/part-of: devsync
  annotations:
    # Attaches the TF-owned Cloud Armor policy (infra/terraform/armor.tf) to
    # the LB backend service via BackendConfig devsync-armor.
    cloud.google.com/backend-config: '{"default": "devsync-armor"}'
spec:
  type: ClusterIP
  selector:
    app: devsync-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
