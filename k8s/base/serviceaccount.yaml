# GCP_PROJECT_ID is a deploy-time token, not a real value: the deploy workflow
# substitutes it into the RENDERED manifest (never editing this source file).
# Same token is used in clustersecretstore.yaml — keep both in sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsync-ksa
  namespace: devsync
  annotations:
    # Bound to the devsync-runner GSA by Terraform (modules/iam).
    iam.gke.io/gcp-service-account: devsync-runner@GCP_PROJECT_ID.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/part-of: devsync
