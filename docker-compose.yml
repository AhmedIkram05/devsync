services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devsync-backend
    restart: on-failure
    depends_on:
      devsync-postgres:
        condition: service_healthy
      devsync-redis:
        condition: service_healthy
    environment:
      - FLASK_APP=src.app:create_app
      - FLASK_ENV=development
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://devsync:${POSTGRES_PASSWORD}@devsync-postgres:5432/devsync?sslmode=disable
      - REDIS_URL=${REDIS_URL:-redis://devsync-redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8000:8000"
    networks:
      - devsync-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devsync-frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_UPSTREAM=http://backend:8000
    ports:
      - "${DEVSYNC_FRONTEND_PORT:-3000}:80"
    # The image runs its non-root nginx (USER nginx, uid 101). k8s grants
    # NET_BIND_SERVICE for :80 (frontend-deployment.yaml); compose instead
    # lowers the unprivileged port floor so uid 101 can bind :80.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    networks:
      - devsync-network

  devsync-redis:
    image: redis:7.4-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: devsync-redis
    restart: unless-stopped
    networks:
      - devsync-network
    # Same shape as k8s/base/redis.yaml: ephemeral queue/ratelimiter state,
    # no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  devsync-postgres:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: devsync-postgres
    restart: unless-stopped
    networks:
      - devsync-network
    environment:
      POSTGRES_DB: devsync
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${DEVSYNC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - devsync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsync -d devsync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devsync-postgres-data:

networks:
  devsync-network:
    driver: bridge
