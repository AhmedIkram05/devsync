openapi: 3.0.0
info:
  title: DevSync API
  version: 1.1.0
  description: API documentation for DevSync, updated to match the current backend routes and payloads.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://gcp.devsyncapp.me/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Token issue, refresh, logout and permission discovery.
  - name: Users
    description: Directory lookups plus the caller's own profile.
  - name: Projects
    description: Project lifecycle and per-project task rollups.
  - name: Tasks
    description: Task CRUD.
  - name: Comments
    description: Comments attached to a task.
  - name: Dashboard
    description: Role-scoped dashboard projections.
  - name: Notifications
    description: Personal notification inbox.
  - name: Reports
    description: Generated reports, restricted to team leads and admins.
  - name: Admin
    description: User administration, system settings and audit-log maintenance.
  - name: Audit
    description: Read access to the audit trail.
  - name: GitHub Integration
    description: GitHub App OAuth, repository linking and issue/PR sync.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token_cookie

  schemas:
    ErrorResponse:
      description: >
        Legacy shape, referenced by no operation. The live error bodies are
        BadRequestError, UnauthorizedError, ForbiddenError, NotFoundError,
        RateLimitError and InternalServerError - see docs/backend/api-conventions.md.
      type: object
      properties:
        message:
          type: string
        error:
          type: string

    BadRequestError:
      type: object
      description: >
        Emitted by `@validate_json` and the schema validators. Note that
        `GET`/`POST /github/connect` use a bare `{"error": "..."}` body with no
        `status` field instead - see docs/backend/api-conventions.md.
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Missing JSON in request body

    UnauthorizedError:
      type: object
      description: Returned by the JWT middleware before any role check runs.
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Missing or invalid access token
        error:
          type: string
          enum: [token_expired, token_invalid, authorization_required]

    ForbiddenError:
      type: object
      description: >
        Role and permission denials. These bodies omit `status` - a known
        inconsistency, see docs/backend/api-conventions.md.
      properties:
        message:
          type: string
          example: Insufficient permissions

    NotFoundError:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Resource not found
        error:
          type: string
          example: Task not found

    RateLimitError:
      type: object
      description: >
        Every operation is subject to the global 300 requests / 60s limiter, so
        this response is possible on any endpoint. A subset of admin endpoints
        additionally carry a tighter per-route bucket, whose message reads
        "Rate limit exceeded. Please try again later.".
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Global rate limit exceeded. Please try again later.

    InternalServerError:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Internal server error
        error:
          type: string
          example: An unexpected error occurred
        traceback:
          type: string
          nullable: true
          description: Only populated when the app runs in DEBUG mode.
          example: 'Traceback (most recent call last): ...'

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: integer

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    PermissionsResponse:
      type: object
      properties:
        role:
          type: string
        permissions:
          type: array
          items:
            type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [developer, team_lead, admin]
        github_username:
          type: string
        avatar:
          type: string
        github_connected:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    ProjectMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, completed, on_hold, cancelled]
        github_repo:
          type: string
        created_by:
          type: integer
        creator_name:
          type: string
        team_members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    ProjectResponse:
      type: object
      properties:
        message:
          type: string
        project:
          $ref: '#/components/schemas/Project'

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        assigned_to:
          type: integer
        created_by:
          type: integer
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        project_id:
          type: integer

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    TaskResponse:
      type: object
      properties:
        message:
          type: string
        task:
          $ref: '#/components/schemas/Task'

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        task_id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        author_name:
          type: string
        user_avatar:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommentListResponse:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    CommentResponse:
      type: object
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/Comment'

    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        notification_type:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        content:
          type: string
        reference_id:
          type: string
        task_id:
          type: integer
        is_read:
          type: boolean
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer

    Report:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [tasks, developers, github]
        dateRange:
          type: string
          enum: [week, month, quarter, year]
        summary:
          type: object
          additionalProperties: true
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        generatedAt:
          type: string
          format: date-time

    PaginationReportResponse:
      type: object
      properties:
        message:
          type: string
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ReportResponse:
      type: object
      properties:
        message:
          type: string
        report:
          $ref: '#/components/schemas/Report'

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        actor_user_id:
          type: integer
        actor_name:
          type: string
        actor_role:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        total:
          type: integer
        pages:
          type: integer
        current_page:
          type: integer

    AuditLogResponse:
      type: object
      properties:
        log:
          $ref: '#/components/schemas/AuditLog'

    SystemSettings:
      type: object
      properties:
        default_user_role:
          type: string
        allow_self_registration:
          type: boolean
        audit_log_retention_days:
          type: integer
        auto_archive_completed_projects:
          type: boolean
        project_retention_days:
          type: integer
        notify_on_overdue_tasks:
          type: boolean
        app_name:
          type: string
        allow_registration:
          type: boolean
        github_integration_enabled:
          type: boolean
        notification_settings:
          type: object
          additionalProperties:
            type: boolean

    SystemSettingsResponse:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/SystemSettings'

    SystemStatsResponse:
      type: object
      properties:
        users:
          type: object
          properties:
            total:
