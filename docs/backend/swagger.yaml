          type: boolean
        message:
          type: string
        github_username:
          type: string

    DashboardResponse:
      type: object
      additionalProperties: true

security:
  - BearerAuth: []
  - CookieAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [developer, team_lead, admin]
            example:
              name: Sara Lindqvist
              email: sara.lindqvist@devsyncapp.me
              password: correct-horse-battery
              role: developer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Account created. Check your inbox to verify the address.
                user_id: 12
        '400':
          description: Request body was missing, not JSON, or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
              example:
                status: error
                message: Missing JSON in request body
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                status: error
                message: Global rate limit exceeded. Please try again later.
        '500':
          description: Unhandled server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              example:
                status: error
                message: Internal server error
                error: An unexpected error occurred
                traceback: null

  /auth/login:
    post:
      summary: Authenticate a user and return JWT tokens
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
            example:
              email: ahmed.ikram@devsyncapp.me
              password: correct-horse-battery
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIiwiaWF0IjoxNzg5MDc1NjEwMH0.kQ3vZ8s1pL7mW0yR5tN9bH2cJ4xF6dA8eG1iU3oP5qM0
                refresh_token: rt_7f3c9a21b6e84d5fa0c37d9e5b2148c6f0a9d3e7b5c1f28406a3b9d7e1c5f028
                user:
                  id: 1
                  name: Ahmed Ikram
                  email: ahmed.ikram@devsyncapp.me
                  role: admin
        '400':
          description: Request body was missing, not JSON, or failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
              example:
                status: error
                message: Missing JSON in request body
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                status: error
                message: Global rate limit exceeded. Please try again later.
        '500':
          description: Unhandled server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              example:
                status: error
                message: Internal server error
                error: An unexpected error occurred
                traceback: null

  /auth/refresh:
    post:
      summary: Refresh the access token using a refresh token
      tags: [Authentication]
      operationId: refreshToken
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImFkbWluIiwiaWF0IjoxNzg5MDc1NjEwMH0.kQ3vZ8s1pL7mW0yR5tN9bH2cJ4xF6dA8eG1iU3oP5qM0
                refresh_token: rt_7f3c9a21b6e84d5fa0c37d9e5b2148c6f0a9d3e7b5c1f28406a3b9d7e1c5f028
        '401':
          description: Access token missing, malformed or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              example:
                status: error
                message: Missing or invalid access token
                error: token_expired
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                status: error
                message: Global rate limit exceeded. Please try again later.
        '500':
          description: Unhandled server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              example:
                status: error
                message: Internal server error
                error: An unexpected error occurred
                traceback: null

  /auth/logout:
    post:
      summary: Log out the current user
      tags: [Authentication]
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: string
        '401':
          description: Access token missing, malformed or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              example:
                status: error
                message: Missing or invalid access token
                error: token_expired
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                status: error
                message: Global rate limit exceeded. Please try again later.
        '500':
          description: Unhandled server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              example:
                status: error
                message: Internal server error
                error: An unexpected error occurred
                traceback: null

  /auth/me:
    get:
      summary: Get the current user profile
      tags: [Authentication]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                user:
                  id: 7
                  name: Lena Fischer
                  email: lena.fischer@devsyncapp.me
                  role: developer
                  github_username: lfischer
                  avatar: https://avatars.githubusercontent.com/u/77412003?v=4
                  github_connected: true
                  created_at: '2026-02-03T10:22:00Z'
        '401':
          description: Access token missing, malformed or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              example:
                status: error
                message: Missing or invalid access token
                error: token_expired
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                status: error
                message: Global rate limit exceeded. Please try again later.
        '500':
          description: Unhandled server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
              example:
                status: error
                message: Internal server error
                error: An unexpected error occurred
                traceback: null

  /auth/token:
    post:
      summary: Get an access token directly
      tags: [Authentication]
      operationId: issueToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
            example:
              identifier: ahmed.ikram@devsyncapp.me
              role: developer
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
