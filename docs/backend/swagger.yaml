        title:
          type: string
        state:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        html_url:
          type: string
        body:
          type: string
        user:
          type: object
          properties:
            login:
              type: string
            avatar_url:
              type: string
        labels:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              color:
                type: string

    GitHubPullRequest:
      type: object
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        html_url:
          type: string
        body:
          type: string
        user:
          type: object
          properties:
            login:
              type: string
            avatar_url:
              type: string
        labels:
          type: array
          items:
            type: object
