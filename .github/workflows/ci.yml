name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLASK_ENV: testing
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Path Change Detection ──────────────────────────────────────────────
  changes:
    name: Change detection — path filters
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'pytest.ini'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/public/**'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            perf:
              - 'backend/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'

  # ── Lint & Format ──────────────────────────────────────────────────────
  lint:
    name: Lint & format (ruff + ESLint)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Ruff check — Python linting
        if: needs.changes.outputs.backend == 'true'
        run: uvx ruff@0.16.7 check backend/

      - name: Ruff format check
        if: needs.changes.outputs.backend == 'true'
        run: uvx ruff@0.16.7 format --check backend/

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: ESLint — frontend linting
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npx eslint src/

  # ── Security Scanning ─────────────────────────────────────────────────
  security:
    name: Dependency security scan (pip-audit + npm audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install pip-audit
        run: uv pip install --system "pip-audit==2.10.1"

      - name: pip-audit — Python dependency vulnerabilities
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: bash scripts/pip-audit.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit — frontend dependency vulnerabilities
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm audit --audit-level=critical

  # ── Backend Tests (unit + integration, in-memory SQLite) ───────────────
  backend-tests:
    name: Backend tests (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements.txt "pytest-xdist==3.8.0"

      - name: Run unit tests
        run: |
          pytest backend/tests/unit \
            -n auto \
            -x \
            --cov=backend/src --cov-report=term-missing --cov-report=xml:backend/coverage.xml \
            ${{ github.ref == 'refs/heads/main' && '--cov-fail-under=80' || '' }}

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync-test
          JWT_SECRET_KEY: ci-jwt-secret-key
        run: |
          pytest backend/tests/integration \
            -n auto \
            -x \
            -q

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ── Backend Docker Image Build (with layer caching) ───────────────────
  backend-image-build:
    name: Backend Docker image build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          load: true
          tags: devsync-backend-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend Tests ────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend tests (Jest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          # shellcheck does not grok inline ${{ }} in run blocks — carry the
          # flag via env instead. Threshold stays enforced on main only.
          COVERAGE_THRESHOLD_FLAG: ${{ github.ref == 'refs/heads/main' && '--coverageThreshold={"global":{"branches":75,"functions":85,"lines":85,"statements":85}}' || '' }}
        run: |
          # shellcheck disable=SC2086
          CI=true npm test -- \
            --watchAll=false \
            --coverage \
            --coverageReporters=text-summary \
            --coverageReporters=lcov \
            --maxWorkers=50% \
            $COVERAGE_THRESHOLD_FLAG

      - name: Build frontend production bundle
        if: github.ref == 'refs/heads/main'
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  # ── End-to-End Tests (Cypress) ────────────────────────────────────────
  e2e-tests:
    name: End-to-end tests (Cypress)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000/api/v1

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync-test
          FLASK_ENV: testing
          JWT_SECRET_KEY: ci-jwt-secret-key
          GITHUB_CLIENT_ID: ci-dummy-client-id
          GITHUB_CLIENT_SECRET: ci-dummy-client-secret
        run: |
          cd backend
          nohup gunicorn src.wsgi:app -c gunicorn.conf.py > /tmp/backend.log 2>&1 &
          echo "Waiting for backend to be ready..."
          for _ in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready!"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || { echo "backend never came up"; tail -100 /tmp/backend.log; exit 1; }

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b # v7.4.3
        with:
          working-directory: frontend
          start: npx serve -s build -l 3000 --no-clipboard
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 60
          config: baseUrl=http://localhost:3000
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: Upload Cypress screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore

      - name: Upload backend logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-logs
          path: /tmp/backend.log
          if-no-files-found: ignore

  # ── API Load Testing (k6) ────────────────────────────────────────────
  # Hard gate: k6 thresholds live in backend/tests/perf/api-load.js and fail
  # the build on breach. A committed baseline (backend/tests/perf/baseline.json)
  # adds order-of-magnitude regression detection via check_baseline.py.
  perf:
    name: Load test (k6)
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Create database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync-test
          # development (not testing): testing pins SQLite in-memory, which
          # would silently drop the schema in a separate gunicorn process.
          FLASK_ENV: development
          JWT_SECRET_KEY: ci-jwt-secret-key
        run: |
          python -c "from src.app import create_app; from src.db.models import db; app, _ = create_app(); ctx = app.app_context(); ctx.push(); db.create_all(); ctx.pop()"

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://devsync:devsync@localhost:5432/devsync-test
          # development (not testing): the load test must hit the real Postgres
          # schema created above, not a per-process empty in-memory SQLite DB.
          FLASK_ENV: development
          JWT_SECRET_KEY: ci-jwt-secret-key
          # Disable the global rate limiter: the load test must saturate the
          # app, not its throttle. Never set this outside a load-test env.
          RATE_LIMIT_REQUESTS_PER_WINDOW: "0"
        run: |
          nohup gunicorn src.wsgi:app -c gunicorn.conf.py > /tmp/backend.log 2>&1 &
          echo "Waiting for backend to be ready..."
          for _ in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready!"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || { echo "backend never came up"; tail -100 /tmp/backend.log; exit 1; }

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Run k6 load test
        working-directory: backend
        env:
          BASE_URL: http://localhost:8000
        run: |
          k6 run \
            --vus 10 --duration 30s \
            --summary-export=/tmp/k6-summary.json \
            tests/perf/api-load.js

      - name: Check against committed baseline
        run: |
          python3 backend/tests/perf/check_baseline.py \
            /tmp/k6-summary.json \
            --baseline backend/tests/perf/baseline.json

      - name: Upload k6 load test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-test-results
          path: /tmp/k6-summary.json
          if-no-files-found: ignore

      - name: Upload backend logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-backend-logs
          path: /tmp/backend.log
          if-no-files-found: ignore

  # ── Coverage Upload (Codecov) ─────────────────────────────────────────
  coverage:
    name: Coverage upload (Codecov)
    needs: [changes, backend-tests, frontend-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download backend coverage
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/coverage.xml,frontend/coverage/lcov.info
          flags: unittests
          name: devsync-coverage
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── K8s Manifest Validation (kustomize + kubeconform) ──────────────────
  # Plan docs/planning/k8s-prod-platform.md §5.5: additive only — validates
  # prod/pr overlays with strict schema conformance.
  k8s-validate:
    name: K8s manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: 5.4.3

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Build overlays + kubeconform -strict
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas
          kustomize build k8s/overlays/pr | kubeconform -strict -ignore-missing-schemas
