name: K8s PR Environment (ephemeral namespace)

# Plan: docs/planning/k8s-prod-platform.md §5.5.
# Every PR touching app or manifests gets a run-scoped K8s namespace pr-<n>
# on the standing cluster: build+push its own images → smoke → sticky comment
# → namespace deleted after the run (pass or fail — it is a smoke env, not a
# standing one). The close-event job sweeps leftovers from cancelled runs.
# The pr overlay drops ESO/ExternalSecret by design, so the workflow creates
# devsync-app-secrets directly from GH secrets (Deployments reference it via
# secretKeyRef).
#
# ACCEPTED RISK (documented, revisit during infra work): PR namespaces live on
# the shared standing prod cluster (CLUSTER_NAME=devsync-prod). This workflow
# must therefore stay restricted to same-repo PRs — the head-repo guards on
# build-push / pr-env / comment below reject fork PRs entirely (they never get
# secrets, cluster creds, or a namespace). Hard cluster-isolation for PRs
# (dedicated cluster or node pool + taints) is an infra/terraform task, not a
# workflow-file change.
#
# workflow_dispatch exists to rebuild a stuck/failed preview namespace without
# push-bumping the PR: pass the PR number via the pr_number input.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose preview environment should be rebuilt"
        type: number
        required: true

permissions:
  contents: read
  id-token: write # GCP WIF (OIDC federation) + Trivy/AR auth
  pull-requests: write # sticky comment

concurrency:
  group: k8s-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  CLUSTER_NAME: devsync-prod
  CLUSTER_LOCATION: us-central1-a
  PR_NS: pr-${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  build-push:
    name: Build + push PR images (AR, Trivy gate)
    if: (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    outputs:
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image names
        id: img-names
        run: |
          AR="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY:-devsync-repo}"
          echo "backend-image=${AR}/devsync-backend" >> "$GITHUB_OUTPUT"
          echo "frontend-image=${AR}/devsync-frontend" >> "$GITHUB_OUTPUT"

      - name: Build + push backend
        id: build-backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.img-names.outputs.backend-image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate — backend (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img-names.outputs.backend-image }}@${{ steps.build-backend.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build + push frontend (both transports)
        id: build-frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.img-names.outputs.frontend-image }}:${{ github.sha }}
          build-args: REACT_APP_SOCKET_TRANSPORT=both
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate — frontend (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img-names.outputs.frontend-image }}@${{ steps.build-frontend.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  pr-env:
    name: Deploy PR #${{ github.event.pull_request.number || inputs.pr_number }} + smoke
    needs: build-push
    if: (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
        with:
          kustomize-version: 5.4.3

      - name: Create namespace + app secrets (pr overlay drops ESO)
        run: |
          kubectl create namespace "$PR_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic devsync-app-secrets -n "$PR_NS" \
            --from-literal=DATABASE_URL="${{ secrets.PR_DATABASE_URL }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.PR_JWT_SECRET_KEY }}" \
            --from-literal=SECRET_KEY="${{ secrets.PR_SECRET_KEY }}" \
            --from-literal=GITHUB_CLIENT_ID="${{ secrets.PR_GITHUB_CLIENT_ID }}" \
            --from-literal=GITHUB_CLIENT_SECRET="${{ secrets.PR_GITHUB_CLIENT_SECRET }}" \
            --from-literal=FERNET_KEY="${{ secrets.PR_FERNET_KEY }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.PR_POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply pr overlay with PR-built images
        run: |
          set -euo pipefail
          cd k8s/overlays/pr
          AR="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY:-devsync-repo}"
          kustomize edit set namespace "$PR_NS"
          # Digest pins, not tags (CD parity): the Trivy gate scanned exactly
          # this digest; a mutable :sha tag could race past the scan between
          # build and apply.
          kustomize edit set image "devsync-backend=${AR}/devsync-backend@${{ needs.build-push.outputs.backend_digest }}"
          kustomize edit set image "devsync-frontend=${AR}/devsync-frontend@${{ needs.build-push.outputs.frontend_digest }}"
          # Tripwire: kustomize silently converts "name=:tag" into a tag-only
          # change, which would ship bare docker.io names. Refuse instead.
          # GCP_PROJECT_ID is substituted on the RENDER, never by sed -i on
          # tracked sources (which dirtied the working tree).
          RENDER="$(kubectl kustomize . | sed "s/GCP_PROJECT_ID/${GCP_PROJECT_ID}/g")"
          echo "$RENDER" | grep -q "GCP_PROJECT_ID" && { echo "::error::unresolved GCP_PROJECT_ID placeholder in render"; exit 1; } || true
          echo "$RENDER" | grep -Fqw "image: ${AR}/devsync-backend@${{ needs.build-push.outputs.backend_digest }}" || { echo "::error::backend image not digest-pinned from the scanned build"; exit 1; }
          echo "$RENDER" | grep -Fqw "image: ${AR}/devsync-frontend@${{ needs.build-push.outputs.frontend_digest }}" || { echo "::error::frontend image not digest-pinned from the scanned build"; exit 1; }
          # A completed/failed Job's template is immutable; drop it so this run's
          # migrate spec applies fresh (migrations are idempotent).
          kubectl delete job devsync-migrate -n "$PR_NS" --ignore-not-found=true
          echo "$RENDER" | kubectl apply -f -

      - name: Migrate + wait
        run: |
          kubectl wait --for=condition=complete job/devsync-migrate -n "$PR_NS" --timeout=600s

      - name: Wait for Deployments Available
        run: |
          kubectl wait --for=condition=available deploy/devsync-backend -n "$PR_NS" --timeout=10m
          kubectl wait --for=condition=available deploy/devsync-frontend -n "$PR_NS" --timeout=10m

      - name: Smoke via port-forward (/health + login)
        run: |
          kubectl port-forward svc/devsync-backend 8000:8000 -n "$PR_NS" > /tmp/pf.log 2>&1 &
          PF_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | tee /tmp/smoke.log
          EMAIL="pr${{ github.event.pull_request.number || inputs.pr_number }}-$(date +%s)@devsync.test"
          curl -fsS -X POST http://localhost:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"PR Smoke\",\"email\":\"$EMAIL\",\"password\":\"smoke-test-password\"}" | tee -a /tmp/smoke.log
          kill $PF_PID || true

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-smoke-${{ github.event.pull_request.number || inputs.pr_number }}
          path: /tmp/smoke.log
          if-no-files-found: ignore

      - name: Delete pr namespace (always, pass or fail)
        if: always()
        run: kubectl delete namespace "$PR_NS" --ignore-not-found=true --wait=false

  comment:
    name: Sticky PR comment
    needs: pr-env
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment smoke result
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: k8s-pr-env
          message: |
            ## K8s PR env `${{ env.PR_NS }}` — ${{ needs.pr-env.result == 'success' && 'smoke green' || 'smoke FAILED' }}
            - Backend image: `${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/devsync-backend@${{ needs.build-push.outputs.backend_digest }}`
            - Frontend image: `${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/devsync-frontend@${{ needs.build-push.outputs.frontend_digest }}`
            - Smoke: `curl /health` + register via port-forward (see `pr-smoke` artifact)
            - No Ingress/certs per PR by design — namespace deleted after the run (pass or fail).

  tf-plan:
    name: Terraform plan (infra/terraform diffs)
    if: (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect infra/terraform changes
        id: tf
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" | grep -q '^infra/terraform/'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auth to GCP (WIF)
        if: steps.tf.outputs.tf == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        if: steps.tf.outputs.tf == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init (GCS backend)
        if: steps.tf.outputs.tf == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform init -input=false -backend-config=bucket="${{ secrets.GCP_TF_STATE_BUCKET }}"

      - name: Terraform Plan
        id: plan
        if: steps.tf.outputs.tf == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          # Binary Authorization attestor key (cosign public key PEM), required
          # by binauthz.tf. Without it terraform aborts on the missing
          # required variable and every infra PR gets "PLAN ERROR" with no
          # diff — which the step below used to report as a passing check.
          TF_VAR_binauthz_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          rc=0
          terraform plan -input=false -refresh=false -no-color -detailed-exitcode -out=tfplan > /tmp/tfplan.txt 2>&1 || rc=$?
          tail -200 /tmp/tfplan.txt
          if [ "$rc" = 0 ]; then
            status="NO CHANGES"
          elif [ "$rc" = 2 ]; then
            status="PLAN HAS CHANGES"
          else
            status="PLAN ERROR (exit $rc)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "body<<TFPLAN_EOF"
            echo "## Terraform plan — ${status}"
            echo ''
            echo '```text'
            head -c 15000 /tmp/tfplan.txt
            echo
            echo '```'
            echo "TFPLAN_EOF"
          } >> "$GITHUB_OUTPUT"
          # Fail closed: a plan that errors leaves reviewers with no diff at
          # all, so it must not read as a green check. Matches k8s-cd.yml,
          # which already exits 1 on plan failure. rc=2 is expected here —
          # infra changes are the whole point of the job.
          if [ "$rc" = 1 ]; then
            echo "::error::terraform plan failed (exit ${rc}) — see the comment above"
            exit 1
          fi

      - name: Report plan on PR
        if: ${{ always() && steps.tf.outputs.tf == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan
          message: ${{ steps.plan.outputs.body || 'Plan Preview skipped (infra/terraform unchanged or init failed)' }}

  gc:
    # Sweep for leftovers only: the normal path deletes the namespace at the
    # end of pr-env. This catches cancellations (concurrency group kills
    # in-flight runs) and manually re-run edges where the always() delete
    # never executed.
    name: Sweep leftover seats for PR #${{ github.event.pull_request.number }} on close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Delete namespace (idempotent)
        run: kubectl delete namespace "$PR_NS" --ignore-not-found=true --wait=true
